<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0;padding:0;box-sizing:border-box; }
body { background:#fff; font-family:'Share Tech Mono', monospace,monospace; padding:20px; }
.row { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.meta { font-size:8px; color:#aaa; letter-spacing:0.06em; text-transform:uppercase; min-width:80px; }
.pill { height:26px; border-radius:13px; display:inline-flex;align-items:center;padding:0 14px;
        font-size:9px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer; }
.filled { background:#000;color:#fff;border:1px solid #000; }
.ghost  { background:#fff;color:#000;border:1px solid #000; }
.nav-btn { width:22px;height:22px;border:1px solid #000;display:inline-flex;align-items:center;justify-content:center;font-size:10px;background:#fff;cursor:pointer; }
.play-btn { width:32px;height:32px;background:#000;border-radius:50%;display:inline-flex;align-items:center;justify-content:center; }
.play-icon { width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid #fff;margin-left:2px; }
</style></head><body>
<div class="row"><span class="meta">action pills</span>
  <div class="pill filled">FOCUS</div>
  <div class="pill filled">BREAK</div>
  <div class="pill filled">LONG</div>
  <div class="pill filled">STOP</div>
</div>
<div class="row"><span class="meta">ghost pills</span>
  <div class="pill ghost">FOCUS</div>
  <div class="pill ghost">BREAK</div>
  <div class="pill ghost">START</div>
</div>
<div class="row"><span class="meta">start/pause</span>
  <div class="pill filled">▶ &nbsp;START</div>
  <div class="pill filled">⏸ &nbsp;PAUSE</div>
</div>
<div class="row"><span class="meta">nav arrows</span>
  <div class="nav-btn">‹</div>
  <div class="nav-btn">›</div>
  <span style="font-size:9px;color:#888">calendar prev/next</span>
</div>
<div class="row"><span class="meta">play circle</span>
  <div class="play-btn"><div class="play-icon"></div></div>
  <span style="font-size:9px;color:#888">timer start</span>
</div>
</body></html>
