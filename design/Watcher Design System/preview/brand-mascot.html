<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0;padding:0;box-sizing:border-box; }
body { background:#F0F0F0; padding:20px; font-family:'Share Tech Mono',monospace; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.note {
  background:#fff; border:1px solid #ddd; padding:24px 32px;
  display:flex; flex-direction:column; gap:8px; max-width:320px;
}
.title { font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:#888; }
.body  { font-size:11px; color:#aaa; line-height:1.6; }
.tag   { display:inline-block; font-size:8px; letter-spacing:0.1em; text-transform:uppercase; border:1px solid #E6E6E6; padding:2px 6px; color:#ccc; }
</style>
</head>
<body>
<div class="note">
  <div class="title">Ermine Mascot</div>
  <div class="body">Mascot removed from all screens. Asset held in reserve for future use.</div>
  <div class="tag">Deferred</div>
</div>
</body></html>
