  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ems:baseline;gap:8px;padding:5px 0;border-bottom:1px solid #eee;font-size:11px; }\n.obs-row:last-child { border-bottom:none; }\n.obs-tag { font-size:7px;letter-spacing:0.1em;text-transform:uppercase;border:1px solid #000;padding:1px 5px;flex-shrink:0; }\n.obs-sync { display:flex;align-items:center;gap:6px;margin-top:8px;font-size:9px;color:#aaa; }\n.obs-dot { width:6px;height:6px;background:#000; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"device\">\n  <div class=\"screen\">\n\n    <!-- DAY CLOCK -->\n    <div class=\"s\" id=\"screen-dayclock\">\n      <svg id=\"dc-svg\" viewBox=\"0 0 400 300\"><\u002Fsvg>\n      <div class=\"dc-inner\">\n        <div class=\"dc-time\" id=\"dc-time\">--:--<\u002Fdiv>\n        <div class=\"dc-date\" id=\"dc-date\">———<\u002Fdiv>\n        <div class=\"dc-bar\" id=\"dc-bar\"><\u002Fdiv>\n        <div class=\"dc-pct\" id=\"dc-pct\">—% of day<\u002Fdiv>\n      <\u002Fdiv>\n      \n\n    <!-- DIGITAL CLOCK -->\n    <div class=\"s\" id=\"screen-digital\">\n      <div class=\"dig-wrap\" id=\"dig-display\"><\u002Fdiv>\n      <div class=\"dig-date\" id=\"dig-date\"><\u002Fdiv>\n      \n\n    <!-- POMODORO -->\n    <div class=\"s\" id=\"screen-pomo\">\n      <svg id=\"pomo-svg\" viewBox=\"0 0 400 300\" style=\"position:absolute;top:0;left:0;width:400px;height:300px;\"><\u002Fsvg>\n      <div class=\"pomo-inner\">\n        <div class=\"pomo-time\" id=\"pomo-time\">25:00<\u002Fdiv>\n        <div class=\"pomo-sub\" id=\"pomo-sub\">Focus<\u002Fdiv>\n      <\u002Fdiv>\n      \n    <\u002Fdiv>\n\n    <!-- CALENDAR LIGHT -->\n    <div class=\"s\" id=\"screen-cal\">\n      <div class=\"cal-wrap\">\n        <div class=\"cal-hdr\">\n          <span class=\"cal-nav\" onclick=\"calNav(-1,'cal')\">‹<\u002Fspan>\n          <span class=\"cal-title\" id=\"cal-title-cal\">April 2026<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\">\n            \n            <span class=\"cal-nav\" onclick=\"calNav(1,'cal')\">›<\u002Fspan =\"goTo('tasks-dark')\">Tasks ◼<\u002Fbutton>\n  <button class=\"nav-pill\" onclick=\"goTo('ota')\">OTA<\u002Fbutton>\n  <button class=\"nav-pill\" onclick=\"goTo('obsidian')\">Obsidian<\u002Fbutton>\n<\u002Fdiv>\n\n<script>\n\n// ── Navigation ──────────────────────────────────────\nconst SCREENS = ['dayclock','digital','pomo','cal','cal-dark','tasks','tasks-dark','ota','obsidian'];\nlet current = localStorage.getItem('watcher-screen') || 'dayclock';\n\nfunction goTo(name) {\n  current = name; localStorage.setItem('watcher-screen', name);\n  SCREENS.forEach(s => document.getElementById('screen-'+s).classList.toggle('active', s===name));\n  document.querySelectorAll('.nav-pill').forEach((btn,i) => btn.classList.toggle('active', SCREENS[i]===name));\n  \n}\n\n// ── Shared helpers ───────────────────────────────────\nconst MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst WDAYS  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\nconst ORD = n => n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');\n\n// ── Day Clock ────────────────────────────────────────\nconst dcSvg = document.getElementById('dc-svg');\nconst dcDots = [];\nconst dcPos = [];\nfor(let i=0;i<18;i++) dcPos.push([59+i*16,49]);\nfor(let i=0;i<11;i++) dcPos.push([331,65+i*16]);\nfor(let i=17;i>=0;i--) dcPos.push([59+i*16,241]);\nfor(let i=10;i>=0;i--) dcPos.push([59,65+i*16]);\ndcPos.forEach(([x,y])=>{\n  const r=document.createElementNS('http://www.w3.org/2000/svg','rect');\n  r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width','10');r.setAttribute('height','10');\n  r.setAttribute('fill','#E6E6E6');\n  dcSvg.appendChild(r); dcDots.push(r);\n});\nconst dcBar = document.getElementById('dc-bar');\nconst dcSqs = [];\nfor(let i=0;i<12;i++){const s=document.createElement('div');s.className='dc-sq off';dcBar.appendChild(s);dcSqs.push(s);}\n\nfunction updateDayClock(){\n  const n=new Date();\n  const h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();\n  const pct=(h*3600+m*60+s)/(24*3600);\n  const filled=Math.round(pct*58);\n  dcDots.forEach((r,i)=>r.setAttribute('fill',i<filled?'#111':'#E6E6E6'));\n  document.getElementById('dc-time').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');\n  document.getElementById('dc-date').textContent=WDAYS[n.getDay()]+', '+ORD(n.getDate())+' '+MONTHS[n.getMonth()].slice(0,3)+'. '+n.getFullYear();\n  dcSqs.forEach((sq,i)=>sq.className='dc-sq '+(i<Math.round(pct*12)?'on':'off'));\n  document.getElementById('dc-pct').textContent=Math.round(pct*100)+'% of day';\n}\nsetInterval(updateDayClock,1000); updateDayClock();\n\n// ── Digital Clock ────────────────────────────────────\nconst SEG_MAP={'0':[1,1,1,0,1,1,1],'1':[0,0,1,0,0,1,0],'2':[1,0,1,1,1,0,1],\n  '3':[1,0,1,1,0,1,1],'4':[0,1,1,1,0,1,0],'5':[1,1,0,1,0,1,1],\n  '6':[1,1,0,1,1,1,1],'7':[1,0,1,0,0,1,0],'8':[1,1,1,1,1,1,1],'9':[1,1,1,1,0,1,1]};\nconst SEG_NAMES=[['seg-top','sh'],['seg-tl','sv'],['seg-tr','sv'],['seg-mid','sh'],['seg-bl','sv'],['seg-br','sv'],['seg-bot','sh']];\n\nfunction makeDigEl(ch){\n  const d=document.createElement('div');d.className='digit';\n  (SEG_MAP[ch]||[0,0,0,0,0,0,0]).forEach((on,i)=>{\n    const s=document.createElement('div');\n    s.className='seg '+SEG_NAMES[i][1]+' '+SEG_NAMES[i][0]+' '+(on?'on':'off');\n    d.appendChild(s);\n  });\n  return d;\n}\nfunction makeColEl(){\n  const c=document.createElement('div');c.className='colon-wrap';\n  c.innerHTML='<div class=\"colon-dot\"><\u002Fdiv><div class=\"colon-dot\"><\u002Fdiv>';\n  return c;\n}\nfunction updateDigital(){\n  const n=new Date();\n  const str=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');\n  const disp=document.getElementById('dig-display');disp.innerHTML='';\n  str.split('').forEach(ch=>disp.appendChild(ch===':'?makeColEl():makeDigEl(ch)));\n  document.getElementById('dig-date').textContent=WDAYS[n.getDay()]+', '+ORD(n.getDate())+' '+MONTHS[n.getMonth()].slice(0,3)+'. '+n.getFullYear();\n}\nsetInterval(updateDigital,1000); updateDigital();\n\n// ── Pomodoro ─────────────────────────────────────────\nconst pomoPos=[];\nfor(let i=0;i<18;i++) pomoPos.push([59+i*16,49]);\nfor(let i=0;i<11;i++) pomoPos.push([331,65+i*16]);\nfor(let i=17;i>=0;i--) pomoPos.push([59+i*16,241]);\nfor(let i=10;i>=0;i--) pomoPos.push([59,65+i*16]);\nlet pomoDots=[];\n\nfunction buildPomoDots(){\n  const svg=document.getElementById('pomo-svg'); svg.innerHTML=''; pomoDots=[];\n  pomoPos.forEach(([x,y])=>{\n    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');\n    r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width','10');r.setAttribute('height','10');\n    r.setAttribute('fill','#E6E6E6');svg.appendChild(r);pomoDots.push(r);\n  });\n}\nbuildPomoDots();\n\nlet pomoSec=25*60,pomoTotal=25*60,pomoRunning=false,pomoInterval=null,pomoMode='focus';\nfunction updatePomo(){\n  const m=String(Math.floor(pomoSec/60)).padStart(2,'0'),s=String(pomoSec%60).padStart(2,'0');\n  document.getElementById('pomo-time').textContent=m+':'+s;\n  const f=Math.round((pomoSec/pomoTotal)*58);\n  pomoDots.forEach((r,i)=>r.setAttribute('fill',i<f?'#000':'#E6E6E6'));\n}\nfunction togglePomo(){\n  const btn=document.getElementById('btn-start');\n  if(pomoRunning){\n    clearInterval(pomoInterval);pomoRunning=false;\n    btn.innerHTML='<svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\"><path d=\"M4 2.5L14.5 9L4 15.5V2.5Z\" fill=\"black\"/><\u002Fsvg>';\n  } else {\n    pomoRunning=true;\n    btn.innerHTML='<svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\"><rect x=\"3\" y=\"2\" width=\"4\" height=\"14\" fill=\"black\"/><rect x=\"11\" y=\"2\" width=\"4\" height=\"14\" fill=\"black\"/><\u002Fsvg>';\n    pomoInterval=setInterval(()=>{if(pomoSec>0){pomoSec--;updatePomo();}else{clearInterval(pomoInterval);pomoRunning=false;btn.innerHTML='<svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\"><path d=\"M4 2.5L14.5 9L4 15.5V2.5Z\" fill=\"black\"/><\u002Fsvg>';}},1000);\n  }\n}\nfunction resetPomo(){clearInterval(pomoInterval);pomoRunning=false;pomoSec=pomoTotal;updatePomo();document.getElementById('btn-start').innerHTML='<svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\"><path d=\"M4 2.5L14.5 9L4 15.5V2.5Z\" fill=\"black\"/><\u002Fsvg>';}\nfunction setMode(mode,mins){\n  clearInterval(pomoInterval);pomoRunning=false;pomoMode=mode;pomoTotal=mins*60;pomoSec=pomoTotal;\n  document.getElementById('pomo-sub').textContent=mode==='focus'?'Focus':mode==='break'?'Short Break':'Long Break';\n  document.getElementById('btn-start').innerHTML='<svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\"><path d=\"M4 2.5L14.5 9L4 15.5V2.5Z\" fill=\"black\"/><\u002Fsvg>';\n  ['focus','break','long'].forEach(m=>document.getElementById('pm-'+m).classList.toggle('active',m===mode));\n  updatePomo();\n}\nupdatePomo();\n\n// ── Calendar ─────────────────────────────────────────\nconst calState={'cal':{y:2026,m:3},'cal-dark':{y:2026,m:3}};\nfunction renderCal(id){\n  const st=calState[id];\n  document.getElementById('cal-title-'+id).textContent=MONTHS[st.m]+' '+st.y;\n  const grid=document.getElementById('cal-grid-'+id);grid.innerHTML='';\n  const first=new Date(st.y,st.m,1).getDay(),days=new Date(st.y,st.m+1,0).getDate();\n  const td=new Date(),isToday=d=>d===td.getDate()&&st.m===td.getMonth()&&st.y===td.getFullYear();\n  const prev=new Date(st.y,st.m,0).getDate();\n  for(let i=0;i<first;i++){const c=document.createElement('div');c.className='cal-cell other';c.textContent=prev-first+1+i;grid.appendChild(c);}\n  for(let d=1;d<=days;d++){const c=document.createElement('div');c.className='cal-cell'+(isToday(d)?' today':'');c.textContent=d;grid.appendChild(c);}\n  const trail=(7-((first+days)%7))%7;\n  for(let i=1;i<=trail;i++){const c=document.createElement('div');c.className='cal-cell other';c.textContent=i;grid.appendChild(c);}\n}\nfunction calNav(dir,id){const s=calState[id];s.m+=dir;if(s.m>11){s.m=0;s.y++;}if(s.m<0){s.m=11;s.y--;}renderCal(id);}\n\n// ── Tasks ─────────────────────────────────────────────\nconst TASKS=[\n  {text:'Write weekly review',done:true},{text:'Review pull requests',done:false},\n  {text:'Update Obsidian vault',done:false},{text:'Plan next sprint',done:false},\n  {text:'OTA firmware update',done:false},{text:'Lunch with team',done:false},\n];\nfunction renderTasks(id){\n  const el=document.getElementById('tl-'+id);el.innerHTML='';\n  TASKS.forEach(t=>{\n    const row=document.createElement('div');row.className='task-item';\n    const cb=document.createElement('div');cb.className='t-cb'+(t.done?' checked':'');\n    cb.onclick=()=>{t.done=!t.done;renderTasks('light');renderTasks('dark');};\n    const txt=document.createElement('div');txt.className='t-txt'+(t.done?' done':'');\n    txt.textContent=t.text;\n    row.appendChild(cb);row.appendChild(txt);el.appendChild(row);\n  });\n}\n\n// ── OTA Progress ──────────────────────────────────────\nconst otaBar=document.getElementById('ota-bar');\nconst otaSqs=[];\nfor(let i=0;i<24;i++){const s=document.createElement('div');s.className='ota-sq off';otaBar.appendChild(s);otaSqs.push(s);}\nlet otaProgress=0;\nfunction tickOTA(){\n  if(otaProgress<=24){\n    otaSqs.forEach((s,i)=>s.className='ota-sq '+(i<otaProgress?'on':'off'));\n    const pct=Math.round(otaProgress/24*100);\n    document.getElementById('ota-status').textContent=\n      otaProgress<24?'Downloading… '+pct+'%':'Installing… Complete ✓';\n    otaProgress++;\n  }\n}\nsetInterval(tickOTA,400);\n\n// ── Init ──────────────────────────────────────────────\ndocument.addEventListener('DOMContentLoaded',()=>{\n  renderCal('cal'); renderCal('cal-dark');\n  renderTasks('light'); renderTasks('dark');\n  goTo(current);\n});\n<\u002Fscript>\n<\u002Fdiv><\u002Fdiv><\u002Fbody><\u002Fhtml>"
  </script>
