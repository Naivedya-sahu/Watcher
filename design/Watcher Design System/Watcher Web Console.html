<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watcher · Web Console v7.1</title>
<link rel="stylesheet" href="assets/colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; min-height: 100vh; background: #fff; color: #000;
    font-family: 'Share Tech Mono', 'Courier New', monospace; }
  button, input, select { font-family: inherit; color: inherit; }

  .shell { min-height: 100vh; display: flex; flex-direction: column; background: #fff; color: #000; }
  .shell-dark { background: #0a0a0a; color: #fff; }

  /* top bar */
  .top-bar { display: flex; justify-content: space-between; align-items: stretch;
    border-bottom: 1px solid currentColor; padding: 0 18px; height: 44px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { font-size: 16px; }
  .brand-name { font-size: 14px; letter-spacing: 0.18em; font-weight: 700; }
  .brand-sub { font-size: 9px; letter-spacing: 0.18em; opacity: 0.55;
    border-left: 1px solid currentColor; padding-left: 10px; height: 14px; line-height: 14px; }
  .meta { display: flex; align-items: center; gap: 10px; font-size: 10px; letter-spacing: 0.14em; }
  .meta-item { display: inline-flex; align-items: center; gap: 6px; }
  .meta-sep { opacity: 0.3; }
  .dot-connected    { color: currentColor; }
  .dot-reconnecting { animation: blink 1s steps(2) infinite; }
  .dot-offline      { opacity: 0.35; }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* grid */
  .grid { flex: 1; display: grid; grid-template-columns: 320px 1fr 280px; min-height: 0; }
  .pane { padding: 16px 14px; overflow: auto; }
  .pane-left  { border-right: 1px solid currentColor; }
  .pane-right { border-left:  1px solid currentColor; }
  .pane-center { display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(0deg, transparent 0 23px, rgba(0,0,0,0.04) 23px 24px),
                repeating-linear-gradient(90deg, transparent 0 23px, rgba(0,0,0,0.04) 23px 24px); }
  .shell-dark .pane-center {
    background: repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,255,255,0.05) 23px 24px),
                repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,0.05) 23px 24px); }

  /* section head */
  .sec-head { display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid currentColor; padding: 18px 0 6px; margin-bottom: 8px; }
  .sec-head:first-child { padding-top: 0; }
  .sec-head-l { font-size: 10px; letter-spacing: 0.2em; font-weight: 700; }
  .sec-head-r { font-size: 8px; letter-spacing: 0.18em; opacity: 0.45; }

  /* screen list */
  .screen-list { display: flex; flex-direction: column; gap: 6px; }
  .screen-group-l { font-size: 8px; letter-spacing: 0.22em; opacity: 0.4; padding: 4px 0 2px; }
  .screen-row { display: grid; grid-template-columns: 14px 1fr; column-gap: 6px;
    width: 100%; padding: 4px 6px; background: transparent; color: inherit;
    border: 1px solid transparent; cursor: pointer; text-align: left; line-height: 1.2; }
  .screen-row:hover { border-color: currentColor; }
  .screen-row.active { background: #000; color: #fff; }
  .shell-dark .screen-row.active { background: #fff; color: #000; }
  .screen-row-mark { font-size: 10px; line-height: 14px; }
  .screen-row-label { grid-column: 2; font-size: 11px; letter-spacing: 0.14em; font-weight: 700; }
  .screen-row-path  { grid-column: 2; font-size: 8px; letter-spacing: 0.06em; opacity: 0.55; }
  .screen-row.active .screen-row-path { opacity: 0.7; }

  /* button sim */
  .btn-sim { display: flex; flex-direction: column; gap: 6px; }
  .btn-row { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
  .btn-row-meta { display: flex; flex-direction: column; }
  .btn-row-label { font-size: 10px; letter-spacing: 0.16em; font-weight: 700; }
  .btn-row-hint  { font-size: 8px; letter-spacing: 0.14em; opacity: 0.55; }
  .hw-btn { font-size: 9px; letter-spacing: 0.18em; padding: 5px 8px;
    border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
  .hw-btn:hover { background: currentColor; color: #fff; }
  .shell-dark .hw-btn:hover { color: #000; }
  .hw-btn:active { transform: translate(1px, 1px); }

  /* CONFIG pane */
  .cfg { display: flex; flex-direction: column; gap: 4px; padding: 4px 0 8px; }
  .cfg-row { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 8px; padding: 3px 0; }
  .cfg-k { font-size: 9px; letter-spacing: 0.16em; opacity: 0.6; }
  .cfg-v { display: flex; align-items: center; }
  .cfg-segment { display: inline-flex; border: 1px solid currentColor; }
  .cfg-seg { padding: 4px 8px; background: transparent; color: inherit; border: none;
    border-right: 1px solid currentColor; font-size: 9px; letter-spacing: 0.14em; cursor: pointer; }
  .cfg-seg:last-child { border-right: none; }
  .cfg-seg.active { background: currentColor; color: #fff; }
  .shell-dark .cfg-seg.active { color: #000; }
  .cfg-input-wrap { display: inline-flex; align-items: center; gap: 4px; flex: 1; }
  .cfg-input { background: transparent; border: 1px solid currentColor; padding: 4px 6px;
    font-size: 10px; letter-spacing: 0.06em; color: inherit; min-width: 0; flex: 1;
    font-family: inherit; outline: none; }
  .cfg-input:focus { background: rgba(0,0,0,0.05); }
  .shell-dark .cfg-input:focus { background: rgba(255,255,255,0.08); }
  .cfg-input-time { flex: 0 0 80px; }
  .cfg-input-day  { flex: 0 0 44px; text-align: center; }
  .cfg-input-mo   { flex: 0 0 60px; }
  .cfg-input-type { flex: 0 0 80px; }
  .cfg-input-tag  { flex: 0 0 64px; }
  .cfg-suffix { font-size: 8px; letter-spacing: 0.18em; opacity: 0.55; }
  .cfg-preview { font-size: 10px; letter-spacing: 0.06em; opacity: 0.75; }
  .cfg-static { font-size: 10px; letter-spacing: 0.08em; opacity: 0.7; }
  .cfg-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .cfg-item { display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px; align-items: center; }
  .cfg-item-event { grid-template-columns: 44px 60px 80px 1fr auto; }
  .cfg-toggle { font-size: 8px; letter-spacing: 0.18em; padding: 4px 8px;
    border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; min-width: 36px; }
  .cfg-toggle.on { background: currentColor; color: #fff; }
  .shell-dark .cfg-toggle.on { color: #000; }
  .cfg-x { font-size: 14px; line-height: 1; padding: 0 6px; background: transparent;
    border: 1px solid currentColor; color: inherit; cursor: pointer; }
  .cfg-x:hover { background: currentColor; color: #fff; }
  .shell-dark .cfg-x:hover { color: #000; }
  .cfg-add { font-size: 9px; letter-spacing: 0.18em; padding: 6px;
    border: 1px dashed currentColor; background: transparent; color: inherit; cursor: pointer;
    margin-top: 6px; text-align: center; }
  .cfg-add:hover { background: rgba(0,0,0,0.04); }
  .shell-dark .cfg-add:hover { background: rgba(255,255,255,0.06); }
  .cfg-warn { border-style: solid; }
  .cfg-sub { font-size: 8px; letter-spacing: 0.22em; opacity: 0.5;
    border-bottom: 1px dotted currentColor; padding: 8px 0 3px; margin-top: 4px; }
  .cfg-info { font-size: 8px; letter-spacing: 0.16em; opacity: 0.55; padding: 2px 0 6px; }
  .cfg-mini-log { display: flex; flex-direction: column; gap: 1px; margin-top: 4px;
    border: 1px solid currentColor; padding: 4px 6px; max-height: 90px; overflow: auto; }
  .mini-log-row { display: grid; grid-template-columns: 50px auto 1fr auto; gap: 6px; font-size: 9px; line-height: 1.4; }
  .ml-t { opacity: 0.5; }
  .ml-tag { font-weight: 700; letter-spacing: 0.1em; }
  .ml-l { opacity: 0.85; }
  .ml-s { opacity: 0.55; font-size: 8px; letter-spacing: 0.14em; }
  .cfg-progress { position: relative; border: 1px solid currentColor; height: 18px; margin-top: 4px; overflow: hidden; }
  .cfg-progress-bar { position: absolute; inset: 0 auto 0 0; background: currentColor; transition: width .25s; }
  .cfg-progress-label { position: relative; z-index: 2; font-size: 9px; letter-spacing: 0.16em;
    line-height: 18px; padding: 0 8px; mix-blend-mode: difference; color: #fff; }

  /* canvas */
  .canvas-frame { display: flex; flex-direction: column; }
  .canvas-tab { display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; border: 1px solid currentColor; border-bottom: none;
    font-size: 9px; letter-spacing: 0.18em; }
  .canvas-tab-meta { opacity: 0.55; }
  .canvas-stage { border: 1px solid currentColor; padding: 18px; position: relative; }
  .canvas-foot { display: flex; gap: 6px; align-items: center;
    padding: 6px 10px; border: 1px solid currentColor; border-top: none;
    font-size: 8px; letter-spacing: 0.16em; opacity: 0.7; flex-wrap: wrap; }

  /* EPD */
  .epd-canvas { width: 400px; height: 300px; background: #fff; color: #000;
    position: relative; overflow: hidden; box-shadow: 0 0 0 1px #000;
    font-family: 'Share Tech Mono', monospace; }
  .epd-dark { background: #000; color: #fff; box-shadow: 0 0 0 1px #fff; }
  .epd-refresh-flash { position: absolute; inset: 0; background: #888; opacity: 0;
    animation: refresh 380ms steps(4) forwards; pointer-events: none; z-index: 10; }
  @keyframes refresh { 0% { opacity: 0.55; } 100% { opacity: 0; } }

  .scr { width: 400px; height: 300px; position: absolute; inset: 0; background: #fff; color: #000; }
  .scr-dark { background: #000; color: #fff; }

  .hdr-line { font-size: 10px; letter-spacing: 0.18em; font-weight: 700;
    border-bottom: 1px solid currentColor; padding-bottom: 6px; opacity: 0.85; }

  /* digit */
  .digit { position: relative; width: 62px; height: 110px; flex-shrink: 0; }
  .seg { position: absolute; }
  .seg.on    { background: #111; } .seg.off    { background: #DEDEDE; }
  .seg.on-d  { background: #fff; } .seg.off-d  { background: #1f1f1f; }
  .sh { left: 8px; width: 46px; height: 9px;
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%); }
  .sv { width: 9px; height: 41px;
    clip-path: polygon(0 5px, 50% 0, 100% 0, 100% 100%, 50% 100%, 0 calc(100% - 5px)); }
  .seg-top { top: 0; } .seg-mid { top: 50px; } .seg-bot { top: 101px; }
  .seg-tl { left: 0; top: 9px; } .seg-tr { right: 0; top: 9px; }
  .seg-bl { left: 0; top: 60px; } .seg-br { right: 0; top: 60px; }
  .colon-wrap { display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 16px; width: 18px; height: 110px; padding-bottom: 6px; }
  .colon-dot { width: 9px; height: 9px; }

  /* alarm */
  .alarm-row { display: grid; grid-template-columns: 14px 60px 1fr auto; gap: 10px;
    align-items: center; padding: 6px 0; border-bottom: 1px solid; }
  .scr:not(.scr-dark) .alarm-row { border-color: rgba(0,0,0,0.08); }
  .scr-dark .alarm-row { border-color: rgba(255,255,255,0.1); }
  .alarm-row.focused { background: currentColor; }
  .alarm-row.focused > * { color: #fff; mix-blend-mode: difference; }
  .alarm-mark { font-size: 10px; padding-left: 4px; }
  .alarm-time { font-size: 16px; letter-spacing: 0.04em; }
  .alarm-label { font-size: 10px; letter-spacing: 0.18em; opacity: 0.75; }
  .alarm-toggle { font-size: 9px; letter-spacing: 0.18em; padding-right: 4px; opacity: 0.7; }
  .alarm-foot { position: absolute; bottom: 10px; left: 18px; right: 18px;
    font-size: 8px; letter-spacing: 0.18em; opacity: 0.5; border-top: 1px solid currentColor;
    padding-top: 5px; text-align: center; }

  /* pomodoro */
  .pomo-inner { position: absolute; left: 59px; top: 49px; width: 282px; height: 202px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .pomo-time { font-size: 52px; letter-spacing: 0.06em; line-height: 1; }
  .pomo-sub  { font-size: 10px; opacity: 0.65; letter-spacing: 0.18em; }
  .pomo-meta { font-size: 8px; opacity: 0.55; letter-spacing: 0.2em; margin-top: 2px; }
  .pomo-modes-row { position: absolute; bottom: 14px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 6px; }
  .pmode { font-size: 8px; letter-spacing: 0.14em; height: 22px; border-radius: 11px;
    padding: 0 12px; border: 1px solid #000; background: #fff; color: #000;
    display: inline-flex; align-items: center; }
  .pmode.active { background: #000; color: #fff; }
  .pmode.dk { border-color: #fff; background: #000; color: #fff; }
  .pmode.dk.active { background: #fff; color: #000; }

  /* CALENDAR full bleed */
  .cal-hdr-fb { display: flex; justify-content: space-between; align-items: center;
    height: 30px; padding: 0 14px; border-bottom: 1px solid currentColor; }
  .cal-nav { font-size: 16px; }
  .cal-title-fb { font-size: 11px; letter-spacing: 0.2em; font-weight: 700; }
  .cal-days-fb { display: grid; grid-template-columns: repeat(7,1fr); height: 14px;
    text-align: center; border-bottom: 1px solid currentColor; }
  .cal-days-fb span { font-size: 8px; letter-spacing: 0.14em; opacity: 0.55; line-height: 14px; }
  .cal-grid-fb { display: grid; grid-template-columns: repeat(7,1fr); height: 256px; }
  .cal-cell-fb { position: relative; border-right: 1px solid; border-bottom: 1px solid;
    border-color: rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center;
    font-size: 12px; }
  .scr-dark .cal-cell-fb { border-color: rgba(255,255,255,0.1); }
  .cal-cell-fb:nth-child(7n) { border-right: none; }
  .cal-cell-fb.other { opacity: 0.18; }
  .cal-cell-fb.today { background: #000; color: #fff; font-weight: 700; }
  .cal-cell-fb.today.dk { background: #fff; color: #000; }
  .cal-cell-fb.has-event { font-weight: 700; }
  .cell-num { line-height: 1; }
  .cal-cell-fb.has-event::after { content: ''; position: absolute; bottom: 4px; left: 50%;
    transform: translateX(-50%); width: 8px; height: 2px; background: currentColor; }
  .cal-cell-fb.today.has-event::after { background: #fff; }
  .cal-cell-fb.today.dk.has-event::after { background: #000; }

  /* tasks */
  .task-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px;
    align-items: center; padding: 6px 0; border-bottom: 1px solid; }
  .scr:not(.scr-dark) .task-item { border-color: rgba(0,0,0,0.08); }
  .scr-dark .task-item { border-color: rgba(255,255,255,0.1); }
  .task-item:last-child { border-bottom: none; }
  .t-cb { width: 11px; height: 11px; border: 1.5px solid currentColor; }
  .t-cb.checked { background: #000; }
  .t-cb.checked.dk { background: #fff; }
  .t-txt { font-size: 11px; line-height: 1.35; }
  .t-txt.done { text-decoration: line-through; opacity: 0.3; }
  .t-tag { font-size: 7px; letter-spacing: 0.14em; border: 1px solid currentColor;
    padding: 1px 5px; opacity: 0.6; }

  /* settings (on EPD) */
  .settings-list { display: flex; flex-direction: column; }
  .set-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px;
    padding: 5px 0; font-size: 11px; letter-spacing: 0.08em; border-bottom: 1px solid;
    border-color: rgba(0,0,0,0.08); align-items: center; }
  .scr-dark .set-row { border-color: rgba(255,255,255,0.1); }
  .set-row.focused { background: currentColor; }
  .set-row.focused > * { color: #fff; mix-blend-mode: difference; }
  .set-mark { font-size: 10px; padding-left: 2px; }
  .set-k { font-size: 10px; letter-spacing: 0.14em; font-weight: 700; }
  .muted { opacity: 0.55; font-size: 10px; }
  .bar-label { font-size: 8px; letter-spacing: 0.18em; opacity: 0.55; margin-bottom: 4px; }
  .bar-row { display: flex; gap: 3px; flex-wrap: wrap; }
  .bar-sq { width: 10px; height: 10px; }

  /* right pane */
  .kv { display: flex; flex-direction: column; }
  .kv-row { display: grid; grid-template-columns: 90px auto 1fr; align-items: baseline;
    padding: 4px 0; font-size: 10px; letter-spacing: 0.06em; }
  .kv-k { font-size: 9px; letter-spacing: 0.16em; opacity: 0.55; }
  .kv-dot { height: 1px; border-bottom: 1px dotted currentColor; opacity: 0.3;
    margin: 0 6px; transform: translateY(-3px); }
  .kv-v { font-size: 10px; text-align: right; word-break: break-all; }

  .log { display: flex; flex-direction: column; gap: 2px; max-height: 200px; overflow: auto;
    border: 1px solid currentColor; padding: 6px 8px; }
  .log-row { display: grid; grid-template-columns: 60px 44px 1fr; gap: 6px;
    font-size: 9px; line-height: 1.4; }
  .log-t { opacity: 0.5; }
  .log-tag { font-weight: 700; letter-spacing: 0.08em; }
  .log-msg { opacity: 0.85; word-break: break-word; }

  /* bottom bar */
  .bottom-bar { display: grid; grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid currentColor; }
  .status-cell { padding: 8px 14px; border-right: 1px solid currentColor;
    display: flex; flex-direction: column; gap: 3px; }
  .status-cell:last-child { border-right: none; }
  .cell-k { font-size: 8px; letter-spacing: 0.22em; opacity: 0.5; }
  .cell-v { font-size: 11px; letter-spacing: 0.14em; }
  .pulse .cell-k { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 1; } }

  /* import/export row */
  .io-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .io-btn { display: grid; grid-template-columns: auto auto 1fr; align-items: baseline;
    gap: 6px; padding: 6px 8px; border: 1px solid currentColor; background: transparent;
    color: inherit; cursor: pointer; text-align: left; font-family: inherit; }
  .io-btn:hover { background: currentColor; color: #fff; }
  .shell-dark .io-btn:hover { color: #000; }
  .io-btn:active { transform: translate(1px,1px); }
  .io-btn-icon { font-size: 11px; line-height: 1; }
  .io-btn-l { font-size: 9px; letter-spacing: 0.18em; font-weight: 700; }
  .io-btn-h { font-size: 7px; letter-spacing: 0.14em; opacity: 0.55; text-align: right; }
  .io-btn:hover .io-btn-h { opacity: 0.85; }

  /* system buttons (right pane) */
  .sys-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 4px 0 8px; }
  .sys-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    padding: 8px 6px; border: 1px solid currentColor; background: transparent; color: inherit;
    cursor: pointer; text-align: left; line-height: 1.1; }
  .sys-btn:hover { background: currentColor; color: #fff; }
  .shell-dark .sys-btn:hover { color: #000; }
  .sys-btn:active { transform: translate(1px,1px); }
  .sys-btn.on { background: currentColor; color: #fff; }
  .shell-dark .sys-btn.on { color: #000; }
  .sys-btn-l { font-size: 10px; letter-spacing: 0.16em; font-weight: 700; }
  .sys-btn-h { font-size: 7px; letter-spacing: 0.14em; opacity: 0.6; }

  /* UI theme toggle (floating bottom-right) */
  .ui-theme-toggle { position: fixed; right: 14px; bottom: 56px; z-index: 30;
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px;
    border: 1px solid currentColor; background: #fff; color: #000; cursor: pointer;
    font-family: inherit; font-size: 10px; letter-spacing: 0.18em; }
  .shell-dark .ui-theme-toggle { background: #0a0a0a; color: #fff; }
  .ui-theme-toggle:hover { background: currentColor; color: #fff; }
  .shell-dark .ui-theme-toggle:hover { color: #000; }
  .ui-theme-toggle-icon { font-size: 13px; line-height: 1; }

  /* EPD scaler (replaces canvas-frame chrome) */
  .epd-scaler { transform: scale(var(--epd-scale, 2.2)); transform-origin: center center; }

  /* hide button hints when toggled */
  .shell.no-hints .btn-row-hint,
  .shell.no-hints .sys-btn-h,
  .shell.no-hints .io-btn-h,
  .shell.no-hints .ui-theme-toggle-l { display: none; }
  .shell.no-hints .sys-btn { padding: 10px 8px; }
  .shell.no-hints .io-btn { grid-template-columns: auto auto; }

  /* hide screen paths when toggled */
  .shell.no-paths .screen-row-path { display: none; }

  /* hide select arrow customization in dark */
  select.cfg-input { appearance: none; padding-right: 14px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                      linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 8px) 50%, calc(100% - 4px) 50%;
    background-size: 4px 4px; background-repeat: no-repeat; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script id="watcher-bootstrap" type="application/json">
    {}
    /* Firmware overwrites this block at serve time with the live NVS state:
       { "cfg": {...}, "alarms": [...], "events": [...], "tasks": [...],
         "device": {...}, "network": {...}, "fwVer": "7.1.0" }
