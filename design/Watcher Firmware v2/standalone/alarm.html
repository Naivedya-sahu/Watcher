<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>Watcher · Alarm</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../digit.css">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:#bdb9b1; }
  body {
    display:flex; align-items:center; justify-content:center;
    font-family:'Share Tech Mono','Courier New',monospace;
    padding:32px; box-sizing:border-box;
  }
  .device {
    position: relative;
    padding: 28px 24px 38px 24px;
    background: #2a2a28;
    border-radius: 10px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35), inset 0 1px 0 #555;
  }
  .device::after {
    content: "WATCHER · ALARM";
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font: 9px/1 'Share Tech Mono', monospace;
    letter-spacing: 0.3em; color: #b3aea3; opacity: 0.8;
  }
  .frame {
    width: 400px; height: 300px;
    box-shadow: inset 0 0 0 1px #000;
    background: #fff;
  }
  .meta {
    position: fixed; top: 16px; left: 16px;
    font: 10px/1.5 'Share Tech Mono', monospace;
    color: #444; letter-spacing: 0.1em;
  }
  .meta a { color: #444; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div class="meta">ALARM · 400×300 · 4.2″ E-INK</div>
<div class="device">
  <div id="root" class="frame"></div>
</div>
<script type="text/babel" src="../screens.jsx"></script>
<script type="text/babel">
  const { AlarmScreen } = window;
  function App() {
    
    return <AlarmScreen  />;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
