; The Watcher - ESP32-S3 E-Paper Timer
; ============================================================
; HARDWARE PINOUT (ESP32-S3 DevKitC-1)
; ============================================================
; E-Paper Display (SPI):
;   MOSI/DIN  -> GPIO 11
;   SCLK/CLK  -> GPIO 12
;   CS        -> GPIO 10
;   DC        -> GPIO 15
;   RST       -> GPIO 16
;   BUSY      -> GPIO 17
;
; Buttons (Active-Low, External 10K Pull-ups + 100nF RC):
;   SW1 (Start/Pause) -> GPIO 35
;   SW2 (Mode)        -> GPIO 36
;   SW3 (Reset)       -> GPIO 37
;
; Rotary Encoder (Optional):
;   SW_ENC    -> GPIO 38
;   CLK       -> GPIO 4
;   DT        -> GPIO 5
;
; RTC (DS3231 I2C):
;   SDA       -> GPIO 8
;   SCL       -> GPIO 9
;
; Buzzer (PWM):
;   BUZZER    -> GPIO 38
;
; ============================================================

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

; ============================================================
; LEGACY ENVIRONMENTS (Waveshare EPD library)
; ============================================================
[env:simple]
build_src_filter = -<*> +<simple_timer_bitmap.cpp>

[env:buttons]
build_src_filter = -<*> +<switch_observe.cpp>

[env:pomodoro]
build_src_filter = -<*> +<pomodoro.cpp>

[env:test_partial_refresh]
build_src_filter = -<*> +<epd_partial_refresh_test.cpp>

; ============================================================
; GxEPD2 ENVIRONMENT (Recommended)
; ============================================================
[env:pomodoro_gxepd2]
build_src_filter = -<*> +<pomodoro_gxepd2.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DENABLE_GxEPD2_GFX=0