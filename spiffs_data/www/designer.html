<!DOCTYPE html>
<!-- Watcher v7.1 · Designer / EPD Mirror
     Purpose  : Side-by-side view of screen design HTML (left) and live EPD
                framebuffer read back from device (right). Design-only — no push.
     Served at: http://watcher.local/designer
     Endpoints: GET /screens/<name>.html  — screen design HTML
                GET /api/bitmap           — raw 15000-byte EPD framebuffer
                GET /api/state            — device state JSON
     No CDN / no internet required. All assets self-contained.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watcher · Designer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0e0e0e;
    --bg2:    #1a1a1a;
    --border: #2e2e2e;
    --accent: #e0e0e0;
    --dim:    #666;
    --green:  #4caf50;
    --red:    #f44336;
    --yellow: #ffb300;
    --font:   'Share Tech Mono', 'Courier New', monospace;
    --r:      4px;
  }

  body {
    background: var(--bg); color: var(--accent);
    font-family: var(--font); font-size: 12px;
    min-height: 100vh; display: flex; flex-direction: column;
  }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 13px; letter-spacing: 0.2em; font-weight: 700; color: #fff; }
  .logo-sub { font-size: 10px; letter-spacing: 0.12em; color: var(--dim); }
  .hdr-spacer { flex: 1; }
  #status-bar {
    font-size: 11px; letter-spacing: 0.08em;
    padding: 4px 10px; border-radius: var(--r);
    background: var(--bg2); border: 1px solid var(--border);
    min-width: 180px; text-align: center; transition: color 0.2s;
  }
  #status-bar.ok   { color: var(--green);  border-color: var(--green); }
  #status-bar.warn { color: var(--yellow); border-color: var(--yellow); }
  #status-bar.err  { color: var(--red);    border-color: var(--red); }

  /* ── Controls ───────────────────────────────────────────── */
  .controls {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .ctrl-label { color: var(--dim); letter-spacing: 0.1em; }
  select, button { font-family: var(--font); font-size: 11px; letter-spacing: 0.08em;
    background: var(--bg2); color: var(--accent); border: 1px solid var(--border);
    border-radius: var(--r); padding: 5px 12px; cursor: pointer; outline: none; }
  button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.primary { border-color: #555; background: #222; }
  .sep { width: 1px; height: 20px; background: var(--border); }
  label.toggle { display: flex; align-items: center; gap: 6px;
    color: var(--dim); font-size: 10px; letter-spacing: 0.08em; cursor: pointer; }
  label.toggle input { cursor: pointer; accent-color: var(--green); }

  /* ── Panels ─────────────────────────────────────────────── */
  .panels { display: flex; flex: 1; overflow: hidden; }
  .panel {
    flex: 1; display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
  }
  .panel:last-child { border-right: none; }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--bg2);
  }
  .panel-title { font-size: 10px; letter-spacing: 0.2em; color: var(--dim); }
  .panel-note  { font-size: 9px;  letter-spacing: 0.06em; color: #444; }

  /* EPD frame: exact 400×300 */
  .epd-frame {
    position: relative; width: 400px; height: 300px;
    margin: 20px auto; border: 1px solid var(--border);
    flex-shrink: 0; overflow: hidden; background: #fff;
  }
  .epd-frame iframe, .epd-frame canvas {
    display: block; position: absolute; top: 0; left: 0;
    width: 400px; height: 300px; border: none;
  }
  /* Optional 1.5× zoom */
  .panel.zoomed .epd-frame {
    transform: scale(1.5); transform-origin: top center;
    margin-bottom: calc(300px * 0.5 + 20px);
  }

  .panel-footer {
    display: flex; gap: 8px; padding: 10px 14px; align-items: center;
    border-top: 1px solid var(--border); background: var(--bg2); margin-top: auto;
  }
  .panel-footer .info { font-size: 10px; color: var(--dim); flex: 1; }

  /* ── Device state strip ─────────────────────────────────── */
  .state-strip {
    border-top: 1px solid var(--border); background: var(--bg2);
    padding: 10px 20px; display: flex; align-items: center;
    gap: 20px; flex-wrap: wrap;
  }
  #state-text {
    font-size: 10px; letter-spacing: 0.06em; color: var(--dim); line-height: 1.8;
  }
  .zoom-toggle { font-size: 9px; color: var(--dim); cursor: pointer; }
  .zoom-toggle:hover { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">WATCHER · DESIGNER</div>
    <div class="logo-sub">EPD MIRROR</div>
  </div>
  <div class="hdr-spacer"></div>
  <div id="status-bar">Ready</div>
</header>

<div class="controls">
  <span class="ctrl-label">SCREEN</span>
  <select id="screen-sel">
    <option value="clock">Clock</option>
    <option value="pomodoro">Pomodoro</option>
    <option value="alarm">Alarm</option>
    <option value="calendar">Calendar</option>
    <option value="tasks">Tasks</option>
    <option value="settings">Settings</option>
  </select>
  <button id="btn-load" class="primary">Load Design ↗</button>
  <button id="btn-screen">Set Device Screen</button>

  <div class="sep"></div>

  <button id="btn-refresh">↙ Refresh EPD</button>
  <button id="btn-ota">Start OTA</button>
  <input type="text" id="ota-url" placeholder="OTA URL (https://...)" 
         style="flex: 1; max-width: 300px; padding: 5px 8px; font-size: 11px; font-family: inherit;">
  <button id="btn-set-url">Set URL</button>

  <label class="toggle">
    <input type="checkbox" id="auto-refresh"> Auto-refresh (2s)
  </label>
</div>

<div class="panels">

  <!-- Left: screen design HTML (browser rendering, for visual reference) -->
  <div class="panel" id="panel-design">
    <div class="panel-header">
      <span class="panel-title">SCREEN DESIGN · BROWSER</span>
      <span class="panel-note">visual reference only — Share Tech Mono font · scripts run</span>
    </div>
    <div class="epd-frame">
      <iframe id="design-iframe" width="400" height="300"
              sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <div class="panel-footer">
      <button id="btn-reload">↺ Reload</button>
      <span class="zoom-toggle" id="zoom-design" title="Toggle 1.5× zoom">⊕ zoom</span>
    </div>
  </div>

  <!-- Right: live EPD framebuffer read-back from device -->
  <div class="panel" id="panel-epd">
    <div class="panel-header">
      <span class="panel-title">EPD MIRROR · DEVICE OUTPUT</span>
      <span class="panel-note">reads /api/bitmap — what the physical display actually shows</span>
    </div>
    <div class="epd-frame">
      <canvas id="epd-canvas" width="400" height="300"></canvas>
    </div>
    <div class="panel-footer">
      <span class="info" id="epd-info">—</span>
      <span class="zoom-toggle" id="zoom-epd" title="Toggle 1.5× zoom">⊕ zoom</span>
    </div>
  </div>

</div>

<!-- Device state strip -->
<div class="state-strip">
  <span class="ctrl-label" style="font-size:10px">DEVICE STATE</span>
  <div id="state-text">—</div>
</div>

<script>
'use strict';

const EPD_W    = 400;
const EPD_H    = 300;
const FB_BYTES = EPD_W * EPD_H / 8;  // 15000

let autoTimer = null;

// ── Status helper ──────────────────────────────────────────────
function setStatus(msg, type = '') {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = type;
}

// ── Load design screen into iframe ─────────────────────────────
function loadScreen() {
  const name   = document.getElementById('screen-sel').value;
  const iframe = document.getElementById('design-iframe');
  setStatus(`Loading design: ${name}…`, 'warn');
  iframe.onload  = () => setStatus(`Design loaded: ${name}`, 'ok');
  iframe.onerror = () => setStatus(`Failed to load ${name}.html`, 'err');
  iframe.src = `/screens/${name}.html`;
}

document.getElementById('btn-load').addEventListener('click', loadScreen);
document.getElementById('btn-reload').addEventListener('click', loadScreen);
document.getElementById('screen-sel').addEventListener('change', loadScreen);

async function sendCmd(payload) {
  const resp = await fetch('/api/cmd', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  let data = null;
  try {
    data = await resp.json();
  } catch (_) {
    data = null;
  }
  if (!resp.ok || !data || data.ok !== true) {
    throw new Error((data && data.err) ? data.err : `cmd ${resp.status}`);
  }
  return data;
}

document.getElementById('btn-screen').addEventListener('click', async function() {
  const name = document.getElementById('screen-sel').value;
  try {
    setStatus(`Switching device screen: ${name}…`, 'warn');
    await sendCmd({ cmd: 'screen', screen: name });
    await refreshEpd();
    setStatus(`Device screen set: ${name}`, 'ok');
  } catch (e) {
    setStatus('Screen switch failed: ' + e.message, 'err');
  }
});

// ── Draw raw EPD bitmap to canvas ─────────────────────────────
// buf: Uint8Array(15000) — fb_t::buf format
//   bit=1 → WHITE (paper), bit=0 → BLACK (ink). MSB = leftmost pixel.
function drawBitmap(buf, canvas) {
  const ctx  = canvas.getContext('2d');
  const imgd = ctx.createImageData(EPD_W, EPD_H);
  const out  = imgd.data;
  for (let y = 0; y < EPD_H; y++) {
    for (let x = 0; x < EPD_W; x++) {
      const bitVal = (buf[y * (EPD_W >> 3) + (x >> 3)] >> (7 - (x & 7))) & 1;
      const v = bitVal ? 255 : 0;
      const i = (y * EPD_W + x) * 4;
      out[i] = out[i+1] = out[i+2] = v;
      out[i+3] = 255;
    }
  }
  ctx.putImageData(imgd, 0, 0);
}

// ── Fetch EPD bitmap + state ───────────────────────────────────
async function refreshEpd() {
  setStatus('Fetching EPD…', '');
  try {
    const [bitmapResp, stateResp] = await Promise.all([
      fetch('/api/bitmap'),
      fetch('/api/state'),
    ]);

    if (!bitmapResp.ok) throw new Error(`bitmap ${bitmapResp.status}`);
    const buf = new Uint8Array(await bitmapResp.arrayBuffer());

    if (buf.length !== FB_BYTES) {
      setStatus(`Bad bitmap size: ${buf.length}`, 'err'); return;
    }

    drawBitmap(buf, document.getElementById('epd-canvas'));

    // Ink coverage
    let black = 0;
    for (let i = 0; i < buf.length; i++) {
      let b = ~buf[i] & 0xFF;  // invert: bit=0 is black
      b = b - ((b >> 1) & 0x55);
      b = (b & 0x33) + ((b >> 2) & 0x33);
      black += (((b + (b >> 4)) & 0x0F) * 0x01010101) >> 24;
    }
    const total = EPD_W * EPD_H;
    document.getElementById('epd-info').textContent =
      `${black.toLocaleString()} black · ${(total-black).toLocaleString()} white · ` +
      `${((black/total)*100).toFixed(1)}% ink`;

    // Device state
    if (stateResp.ok) {
      const s = await stateResp.json();
      // Populate OTA URL field
      if (s.ota_url) {
        document.getElementById('ota-url').value = s.ota_url;
      }
      document.getElementById('state-text').innerHTML =
        `screen: <b>${s.screen}</b>  ·  ` +
        `ntp: ${s.ntp_synced ? '✓' : '✗'}  ·  ` +
        `ap: ${s.ap_mode ? 'AP' : 'STA'}  ·  ` +
        `ssid: ${s.ssid || '—'}  ·  ` +
        `fw: ${s.fw_ver}<br>` +
        `ota: ${s.ota_running ? 'running' : 'idle'}  url: ${s.ota_url ? '✓ set' : '✗ not set'}<br>` +
        `pomo: ${s.pomo_mode || '—'}  ${s.pomo_running ? '▶' : '■'}  ` +
        `${fmtSecs(s.pomo_remaining_s)}  ·  session ${s.pomo_session || 1}  ·  ` +
        `tz: ${s.tz || '—'}`;
    }

    setStatus('EPD refreshed ✓', 'ok');
  } catch (e) {
    setStatus('Fetch error: ' + e.message, 'err');
  }
}

document.getElementById('btn-refresh').addEventListener('click', refreshEpd);
document.getElementById('btn-ota').addEventListener('click', async function() {
  try {
    setStatus('Starting OTA…', 'warn');
    await sendCmd({ cmd: 'ota' });
    await refreshEpd();
    setStatus('OTA started', 'ok');
  } catch (e) {
    setStatus('OTA failed: ' + e.message, 'err');
  }
});

document.getElementById('btn-set-url').addEventListener('click', async function() {
  const url = document.getElementById('ota-url').value.trim();
  if (!url) {
    setStatus('Enter OTA URL', 'warn');
    return;
  }
  try {
    setStatus('Setting OTA URL…', 'warn');
    await sendCmd({ cmd: 'cfg', key: 'ota_url', val: url });
    setStatus('OTA URL set ✓', 'ok');
  } catch (e) {
    setStatus('Failed to set URL: ' + e.message, 'err');
  }
});

// ── Auto-refresh toggle ────────────────────────────────────────
document.getElementById('auto-refresh').addEventListener('change', function() {
  if (this.checked) {
    autoTimer = setInterval(refreshEpd, 2000);
    setStatus('Auto-refresh on (2s)', 'ok');
  } else {
    clearInterval(autoTimer);
    autoTimer = null;
    setStatus('Auto-refresh off', '');
  }
});

// ── Zoom toggles ───────────────────────────────────────────────
document.getElementById('zoom-design').addEventListener('click', () => {
  document.getElementById('panel-design').classList.toggle('zoomed');
});
document.getElementById('zoom-epd').addEventListener('click', () => {
  document.getElementById('panel-epd').classList.toggle('zoomed');
});

// ── Helpers ────────────────────────────────────────────────────
function fmtSecs(s) {
  if (!s) return '0:00';
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

// ── Init ───────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadScreen();
  refreshEpd();
});
</script>

</body>
</html>
