<!DOCTYPE html>
<!-- Watcher v7.1 — Pomodoro Screen (pixel-perfect, matches screens.jsx PomodoroScreen)
     400×300 e-paper. Same DAY_RING perimeter as clock. Minutes-only big readout.

     DAY_RING geometry: identical to clock screen (60-square, SQ=10, PX=22, PY=21).
     Ring fill: 120-second cycle — first 60s empties CW, next 60s refills.

     Layout (digitH=150 default, from screens.jsx):
       digitW = 62*(150/110) ≈ 84.5px
       gap = 12px
       totalW = 2*digitW + gap ≈ 181px  → startX = 200 - 181/2 ≈ 110
       Inner band y=28..250 → center ≈ 139 → startY = 139 - 150/2 = 64

     Header: y=24, left=32, right=32, height=titleSize+4 (default 15px)
     Bottom controls: y=bottom-30 = 270
       Play/Pause icon center: (32+18, 270) = (50, 270)
       Stop icon center: (400-32-18, 270) = (350, 270) — NOTE: screens.jsx uses right padding 32
       Mode pills centered between icons, y=270-11=259, h=22, gap=6
         FOCUS(62px) BREAK(60px) LONG(58px) total=186px
         Pills start at: 50+18+6 = 74. Pills area: 400-74-50 = 276px → offset=(276-186)/2=45 → x=119
         But screens.jsx shows bottom:30, grid 3-col: left=play, center=pills, right=stop. Padding 32px.
         Left col: play (justifySelf start). Right col: stop (justifySelf end). Center: pills.

     Template vars: {{pomo_mm}}, {{pomo_ss}}, {{pomo_filled}}, {{pomo_running}},
       {{pomo_mode}}, {{session_idx}}, {{mode_is_focus}}, {{mode_is_break}}, {{mode_is_long}}.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watcher · Pomodoro</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:400px; height:300px; background:#fff; overflow:hidden;
       font-family:'Share Tech Mono','Courier New',monospace; position:relative; }
#ring { position:absolute; top:0; left:0; pointer-events:none; }

/* Header row */
.hdr { position:absolute; top:24px; left:32px; right:32px;
       display:flex; justify-content:space-between; align-items:center; }
.hdr-title   { font-size:11px; letter-spacing:0.18em; font-weight:700; }
.hdr-session { font-size:9px;  letter-spacing:0.14em; opacity:0.6; white-space:nowrap; }

/* Digit row: absolutely positioned by JS */
#digit-row { position:absolute; display:flex; align-items:center; }

/* Bottom control bar (3-column grid with padding) */
.ctrl { position:absolute; bottom:30px; left:0; right:0;
        display:grid; grid-template-columns:1fr auto 1fr;
        align-items:center; padding:0 32px; }
.ctrl-play { justify-self:start; }
.ctrl-stop { justify-self:end; }
.pills { display:flex; gap:6px; }
.pill { font-family:'Share Tech Mono','Courier New',monospace;
        font-size:8px; letter-spacing:0.14em; text-transform:uppercase;
        height:22px; border-radius:11px; padding:0 12px;
        border:1px solid #000; background:#fff; color:#000;
        display:inline-flex; align-items:center; cursor:pointer; }
.pill.active { background:#000; color:#fff; }
</style>
</head>
<body>

<svg id="ring" viewBox="0 0 400 300" width="400" height="300"></svg>

<!-- Header -->
<div class="hdr">
  <span class="hdr-title">POMODORO</span>
  <span class="hdr-session" id="session-lbl">SESSION 1/3</span>
</div>

<!-- Minutes readout — positioned by JS -->
<div id="digit-row"></div>

<!-- Bottom controls -->
<div class="ctrl">
  <button class="ctrl-play" id="btn-play" style="background:none;border:none;cursor:pointer;">
    <svg id="play-icon" width="22" height="22" viewBox="0 0 18 18" style="display:block;">
      <path d="M4 3 L15 9 L4 15 Z" fill="#000"/>
    </svg>
  </button>
  <div class="pills">
    <span class="pill active" id="pill-FOCUS">FOCUS</span>
    <span class="pill"        id="pill-BREAK">BREAK</span>
    <span class="pill"        id="pill-LONG">LONG</span>
  </div>
  <button class="ctrl-stop" style="background:none;border:none;cursor:pointer;" id="btn-stop">
    <svg width="22" height="22" viewBox="0 0 18 18" style="display:block;">
      <rect x="3.5" y="3.5" width="11" height="11" fill="#000"/>
    </svg>
  </button>
</div>

<!-- Device render commands -->
<script type="text/watcher-render">
clear
dot_ring filled={{pomo_filled}} on=0 off=1
text x=200 y=24 sc=1 c=0 align=c POMODORO
text x=200 y=118 sc=4 c=0 align=c {{pomo_mm}}:{{pomo_ss}}
text x=200 y=172 sc=1 c=0 align=c {{pomo_mode}}
{{#if pomo_running}}
pause cx=50 cy=270 sz=8 c=0
{{else}}
play_tri cx=50 cy=270 sz=8 c=0
{{/if}}
stop_sq cx=350 cy=270 sz=13 c=0
{{#if mode_is_focus}}
pill x=119 y=259 w=62 h=22 c=0 fill=1
text x=150 y=265 sc=1 c=1 align=c FOCUS
pill x=187 y=259 w=60 h=22 c=0 fill=0
text x=217 y=265 sc=1 c=0 align=c BREAK
pill x=253 y=259 w=58 h=22 c=0 fill=0
text x=282 y=265 sc=1 c=0 align=c LONG
{{/if}}
{{#if mode_is_break}}
pill x=119 y=259 w=62 h=22 c=0 fill=0
text x=150 y=265 sc=1 c=0 align=c FOCUS
pill x=187 y=259 w=60 h=22 c=0 fill=1
text x=217 y=265 sc=1 c=1 align=c BREAK
pill x=253 y=259 w=58 h=22 c=0 fill=0
text x=282 y=265 sc=1 c=0 align=c LONG
{{/if}}
{{#if mode_is_long}}
pill x=119 y=259 w=62 h=22 c=0 fill=0
text x=150 y=265 sc=1 c=0 align=c FOCUS
pill x=187 y=259 w=60 h=22 c=0 fill=0
text x=217 y=265 sc=1 c=0 align=c BREAK
pill x=253 y=259 w=58 h=22 c=0 fill=1
text x=282 y=265 sc=1 c=1 align=c LONG
{{/if}}
</script>

<script>
// ── DAY_RING (identical to clock.html) ───────────────────────
const SQ=10, PX=22, PY=21, COLS=18, ROWS=14, x0=8, y0=9;
const RING_POS = [];
for(let i=0;i<COLS;i++)     RING_POS.push([x0+i*PX,y0]);
for(let i=1;i<ROWS;i++)     RING_POS.push([x0+(COLS-1)*PX,y0+i*PY]);
for(let i=COLS-2;i>=0;i--)  RING_POS.push([x0+i*PX,y0+(ROWS-1)*PY]);
for(let i=ROWS-2;i>=1;i--)  RING_POS.push([x0,y0+i*PY]);

const ON='#000', OFF='#E6E6E6';
const svg = document.getElementById('ring');
const dots = RING_POS.map(([x,y]) => {
  const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x',x); r.setAttribute('y',y);
  r.setAttribute('width',SQ); r.setAttribute('height',SQ);
  r.setAttribute('fill',OFF); svg.appendChild(r); return r;
});

// ── SVG digit (same chamfered paths as clock.html) ───────────
const SEG_PATHS = [
  "M14,0 L48,0 L54,4.5 L48,9 L14,9 L8,4.5 Z",
  "M4.5,14 L0,18.5 L0,45 L4.5,50 L9,45 L9,18.5 Z",
  "M57.5,14 L53,18.5 L53,45 L57.5,50 L62,45 L62,18.5 Z",
  "M14,50 L48,50 L54,54.5 L48,59 L14,59 L8,54.5 Z",
  "M4.5,65 L0,69.5 L0,96 L4.5,101 L9,96 L9,69.5 Z",
  "M57.5,65 L53,69.5 L53,96 L57.5,101 L62,96 L62,69.5 Z",
  "M14,101 L48,101 L54,105.5 L48,110 L14,110 L8,105.5 Z"
];
const SEG_MAP = {
  '0':[1,1,1,0,1,1,1],'1':[0,0,1,0,0,1,0],'2':[1,0,1,1,1,0,1],
  '3':[1,0,1,1,0,1,1],'4':[0,1,1,1,0,1,0],'5':[1,1,0,1,0,1,1],
  '6':[1,1,0,1,1,1,1],'7':[1,0,1,0,0,1,0],'8':[1,1,1,1,1,1,1],'9':[1,1,1,1,0,1,1]
};
function makeSvgDigit(ch, h) {
  const w = 62*(h/110);
  const el = document.createElementNS('http://www.w3.org/2000/svg','svg');
  el.setAttribute('width',w); el.setAttribute('height',h);
  el.setAttribute('viewBox','0 0 62 110');
  el.style.cssText = 'display:block;flex-shrink:0';
  const segs = SEG_MAP[ch]||[0,0,0,0,0,0,0];
  SEG_PATHS.forEach((d,i)=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d); p.setAttribute('fill',segs[i]?ON:OFF);
    el.appendChild(p);
  });
  return el;
}

// Layout: digitH=150, gap=12 (from screens.jsx defaults)
const DIGIT_H=150, GAP=12;
const digitW=62*(DIGIT_H/110);
const totalW=2*digitW+GAP;
const startX=Math.round(200-totalW/2);
// Inner band y=28..250, center≈139. startY = 139 - DIGIT_H/2
const startY=Math.round(139-DIGIT_H/2);

const row=document.getElementById('digit-row');
row.style.cssText=`left:${startX}px;top:${startY}px;gap:${GAP}px;`;
const d1=document.createElement('div'); row.appendChild(d1);
const d2=document.createElement('div'); row.appendChild(d2);

// Pomo state
let sec=25*60, total=25*60, running=false, mode='FOCUS', session=1;
const MODES=['FOCUS','BREAK','LONG'], TOTALS=[25*60,5*60,15*60];

function getRingFill(nowSec, nowMin) {
  // 120-second cycle: first 60s empties, next 60s fills
  const cyclePos=(nowMin*60+nowSec)%120;
  const emptying=cyclePos<60;
  const head=emptying?cyclePos:cyclePos-60;
  return i => emptying ? i>head : i<=head;
}

function updateDisplay(nowSec, nowMin) {
  const mm=String(Math.floor(sec/60)).padStart(2,'0');
  // screens.jsx shows minutes only — 2 big digits
  d1.innerHTML=''; d1.appendChild(makeSvgDigit(mm[0],DIGIT_H));
  d2.innerHTML=''; d2.appendChild(makeSvgDigit(mm[1],DIGIT_H));

  document.getElementById('session-lbl').textContent='SESSION '+session+'/3';
  ['FOCUS','BREAK','LONG'].forEach(id=>{
    document.getElementById('pill-'+id).classList.toggle('active',id===mode);
  });

  // Ring
  const getFill=getRingFill(nowSec,nowMin);
  dots.forEach((r,i)=>r.setAttribute('fill',getFill(i)?ON:OFF));

  // Play/pause icon
  document.getElementById('play-icon').innerHTML=running
    ?'<rect x="4" y="3" width="3.4" height="12" fill="#000"/><rect x="10.6" y="3" width="3.4" height="12" fill="#000"/>'
    :'<path d="M4 3 L15 9 L4 15 Z" fill="#000"/>';
}

let interval=null;
document.getElementById('btn-play').onclick=()=>{
  running=!running;
  if(running) interval=setInterval(()=>{
    if(sec>0)sec--;
    const n=new Date(); updateDisplay(n.getSeconds(),n.getMinutes());
  },1000);
  else clearInterval(interval);
  const n=new Date(); updateDisplay(n.getSeconds(),n.getMinutes());
};
document.getElementById('btn-stop').onclick=()=>{
  clearInterval(interval); running=false; sec=total;
  const n=new Date(); updateDisplay(n.getSeconds(),n.getMinutes());
};

function liveRingTick() {
  if(!running) {
    const n=new Date(); updateDisplay(n.getSeconds(),n.getMinutes());
  }
}
setInterval(liveRingTick,1000);
const n=new Date(); updateDisplay(n.getSeconds(),n.getMinutes());
</script>
</body>
</html>
