<!DOCTYPE html>
<!-- Watcher v7.1 — Settings Screen (pixel-perfect, matches screens.jsx SettingsScreen)
     400×300. Header:28px, rows 36px each (8 rows).
     Grid: cursor(14px) | key(96px) | value(1fr). Gap:8px. Padding:5px 14px.
     Focused row: background:#000, color:#fff, cursor=▶.
     Footer: border-top, font-size:8px, opacity:0.55.
     Value text: text-align:right, opacity:0.6 (0.85 on focused row).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watcher · Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:400px; height:300px; background:#fff; overflow:hidden;
       font-family:'Share Tech Mono','Courier New',monospace; position:relative; }

.header { display:flex; justify-content:space-between; align-items:center;
          height:28px; padding:0 14px; border-bottom:1px solid #000; }
.hdr-t { font-size:11px; letter-spacing:0.18em; font-weight:700; }
.hdr-p { font-size:9px;  letter-spacing:0.18em; opacity:0.55; }

.row { display:grid; grid-template-columns:14px 96px 1fr;
       column-gap:8px; align-items:center;
       padding:5px 14px; border-bottom:1px solid #E6E6E6;
       height:36px; box-sizing:border-box; }
.row.focused { background:#000; color:#fff; }

.cur  { font-size:10px; }
.key  { font-size:10px; letter-spacing:0.16em; font-weight:700; }
.val  { font-size:10px; letter-spacing:0.06em; opacity:0.6; text-align:right; }
.row.focused .val { opacity:0.85; }

.footer { position:absolute; bottom:0; left:0; right:0;
          border-top:1px solid #000; padding:5px 14px;
          font-size:8px; letter-spacing:0.18em; opacity:0.55;
          display:flex; justify-content:space-between; }
</style>
</head>
<body>

<div class="header">
  <span class="hdr-t">SETTINGS</span>
  <span class="hdr-p" id="hdr-pos">1 / 8</span>
</div>

<div id="rows"></div>

<div class="footer">
  <span>BTN1/2 NAV</span>
  <span>BTN3 SELECT</span>
</div>

<script>
// Row data — matches screens.jsx SettingsScreen exactly
const ROWS = [
  { k:'WIFI',      v:'home_2.4'     },
  { k:'SIGNAL',    v:'-58 dBm · ▌▌▌▌·' },
  { k:'IP',        v:'192.168.1.42' },
  { k:'THEME',     v:'LIGHT'        },
  { k:'FIRMWARE',  v:'v7.1.0'       },
  { k:'UPDATE',    v:'UP TO DATE'   },
  { k:'TIME ZONE', v:'IST-5:30'     },
  { k:'SLEEP',     v:'5 MIN'        },
];

let focus = 0;

function render() {
  const cont = document.getElementById('rows');
  cont.innerHTML = '';
  ROWS.forEach((r,i) => {
    const row = document.createElement('div');
    row.className = 'row'+(i===focus?' focused':'');
    row.innerHTML = `
      <span class="cur">${i===focus?'▶':' '}</span>
      <span class="key">${r.k}</span>
      <span class="val">${r.v}</span>
    `;
    row.onclick = () => { focus=i; render(); };
    cont.appendChild(row);
  });
  document.getElementById('hdr-pos').textContent = (focus+1)+' / '+ROWS.length;
}
render();

document.addEventListener('keydown', e => {
  if(e.key==='ArrowDown') { focus=Math.min(focus+1,ROWS.length-1); render(); }
  if(e.key==='ArrowUp')   { focus=Math.max(focus-1,0);             render(); }
});
</script>

<!-- Device render commands -->
<script type="text/watcher-render">
clear
text x=18 y=8 sc=1 c=0 align=l SETTINGS
hline x=18 y=20 w=364 c=0
text x=200 y=150 sc=1 c=0 align=c [settings rendered by settings_screen.cpp]
</script>
</body>
</html>
